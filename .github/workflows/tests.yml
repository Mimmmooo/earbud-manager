name: Python and packaging checks

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m compileall -q src tests
      - name: Run offline unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check installation script syntax
        run: bash -n install.sh uninstall.sh
      - name: Validate desktop entry
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/io.github.earbudmanager.App.desktop
